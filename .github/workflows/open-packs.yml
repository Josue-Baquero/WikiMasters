name: Ouvrir les paquets WikiMasters

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: open-packs
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ouvrir les paquets
        env:
          WM_REFRESH_TOKEN: ${{ secrets.WM_REFRESH_TOKEN }}
          WM_ANON_KEY: ${{ secrets.WM_ANON_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python open_packs.py
